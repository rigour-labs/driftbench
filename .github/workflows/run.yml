name: run

# Run the free entrants on a frozen corpus, score, and make a DRAFT release
# `run-<date>-<run id>`
# (docs/ARCH.md). The corpus is a published `corpus-*` release (made by
# collect.yml, checked with `bench guard`, then published), so the run's notes
# name exactly which corpus it used. Labels must already be committed on the branch this runs on:
# `bench report` withholds per-class results otherwise. Paid entrants run only
# with `model`, a `max_usd` cap above 0 and a per-head bound for each
# (`head_bounds`); the harness refuses them otherwise. The cap is split across the
# per-repo jobs in proportion to their selected heads (evenly without a `subsample`). The provider's secret (ANTHROPIC_API_KEY, or
# OPENROUTER_API_KEY for `provider: openrouter`) reaches only the paid review
# step. The diffs handed to tools (work/runs/*/_scratch) contain the
# projects' code and are never uploaded.

on:
  workflow_dispatch:
    inputs:
      corpus_tag:
        description: Published corpus release tag, e.g. corpus-2026-10-09-123456789
        required: true
      entrants:
        description: Entrants (space separated; `free` = every free entrant)
        default: free
      model:
        description: Paid entrants only. One model for all of them, by full ID
        default: ""
      max_usd:
        description: Paid entrants only. Hard dollar cap for the whole run (0 = free run)
        default: "0"
      head_bounds:
        description: Paid entrants only. Per-head bounds from the run estimate, e.g. "claude-code-review=0.8"
        default: ""
      provider:
        description: Paid entrants only. anthropic or openrouter, the same for all of them
        default: anthropic
      max_heads:
        description: Smoke run only. Review this many heads per entrant per repo (first with >= 20 changed lines); 0 = a full run. Never scored
        default: "0"
      repos:
        description: Only these repos (space separated, e.g. "tailscale/tailscale"); empty = every repo in the corpus
        default: ""
      subsample:
        description: A committed selection file (bench subsample), e.g. subsamples/run-2.yaml; empty = every pull request
        default: ""
      diagnostic:
        description: A diagnostic run's purpose (never scored, tagged diagnostic-*); empty = a normal run
        default: ""
      rigour_version:
        description: Diagnostic runs only - the free Rigour entrant at this exact version; empty = the pin
        default: ""
      rigour_config:
        description: Diagnostic runs only - the free Rigour entrant with this rigour.yml (a path in the repo)
        default: ""

permissions:
  contents: read

concurrency:
  group: run
  cancel-in-progress: false

jobs:
  start:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      name: ${{ steps.stamp.outputs.name }}
      repos: ${{ steps.repos.outputs.repos }}
      paid: ${{ steps.paid.outputs.paid }}
      claude_code: ${{ steps.paid.outputs.claude_code }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -e .
      - id: stamp
        run: echo "name=$(date -u +%Y-%m-%d)-${GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"
      - id: paid
        name: Is this a paid run
        env:
          ENTRANTS: ${{ inputs.entrants }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os
          from bench.adapters import PAID, expand
          from bench.adapters.claude_cli import CLAUDE_CODE_VERSION
          paid = any(name in PAID for name in expand(os.environ["ENTRANTS"].split()))
          print(f"paid={'true' if paid else 'false'}")
          print(f"claude_code={CLAUDE_CODE_VERSION}")
          PY
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.paid.outputs.paid == 'true'
        with:
          node-version: "22"
      - name: Install Rigour's core at the pinned version (paid runs; its PROMPT_VERSION goes in run.json)
        if: steps.paid.outputs.paid == 'true'
        run: |
          core=$(python -c "from bench.adapters.rigour import VERSION; print(VERSION)")
          npm install --prefix "$RUNNER_TEMP/rigour" --no-save "@rigour-labs/core@${core}"
      - name: Fix the run record once (start time, entrant versions, label blob hashes, paid settings)
        env:
          ENTRANTS: ${{ inputs.entrants }}
          NAME: ${{ steps.stamp.outputs.name }}
          MODEL: ${{ inputs.model }}
          MAX_USD: ${{ inputs.max_usd }}
          HEAD_BOUNDS: ${{ inputs.head_bounds }}
          PROVIDER: ${{ inputs.provider }}
          PAID: ${{ steps.paid.outputs.paid }}
          MAX_HEADS: ${{ inputs.max_heads }}
          SUBSAMPLE: ${{ inputs.subsample }}
          DIAGNOSTIC: ${{ inputs.diagnostic }}
          RIGOUR_VERSION: ${{ inputs.rigour_version }}
          RIGOUR_CONFIG: ${{ inputs.rigour_config }}
        run: |
          paid_args=(--max-heads "$MAX_HEADS")
          if [ -n "$SUBSAMPLE" ]; then paid_args+=(--subsample "$SUBSAMPLE"); fi
          if [ -n "$DIAGNOSTIC" ]; then paid_args+=(--diagnostic "$DIAGNOSTIC"); fi
          if [ -n "$RIGOUR_VERSION" ]; then paid_args+=(--rigour-version "$RIGOUR_VERSION"); fi
          if [ -n "$RIGOUR_CONFIG" ]; then paid_args+=(--rigour-config "$RIGOUR_CONFIG"); fi
          if [ "$PAID" = "true" ]; then
            paid_args+=(--model "$MODEL" --max-usd "$MAX_USD" --provider "$PROVIDER")
            paid_args+=(--rigour-core "$RUNNER_TEMP/rigour/node_modules/@rigour-labs/core")
            for bound in $HEAD_BOUNDS; do paid_args+=(--head-bound "$bound"); done
          fi
          # word splitting of ENTRANTS is intended: one argument per entrant name
          python -m bench manifest --entrants $ENTRANTS --out "manifest/$NAME" "${paid_args[@]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: manifest
          path: manifest/${{ steps.stamp.outputs.name }}/run.json
          if-no-files-found: error
          retention-days: 90
      - name: Fetch the frozen corpus
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.corpus_tag }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'corpus-*.json' --dir release
          mkdir -p work/corpus
          for f in release/corpus-*.json; do mv "$f" "work/corpus/${f#release/corpus-}"; done
      - id: repos
        env:
          ONLY: ${{ inputs.repos }}
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import json, os, pathlib, sys
          known = sorted(json.loads(p.read_text())["repo"] for p in pathlib.Path("work/corpus").glob("*.json"))
          only = os.environ["ONLY"].split()
          unknown = [r for r in only if r not in known]
          if unknown:
              sys.exit(f"repos not in the corpus: {unknown}")
          print("repos=" + json.dumps(only or known))
          PY

  review:
    needs: start
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        repo: ${{ fromJSON(needs.start.outputs.repos) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"  # Claude Code 2.1.285 requires >= 22
      - run: pip install -e .
      - name: Fetch the frozen corpus
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.corpus_tag }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.json' --dir release
          mkdir -p work/corpus work/points
          for f in release/corpus-*.json; do mv "$f" "work/corpus/${f#release/corpus-}"; done
          for f in release/points-*.json; do mv "$f" "work/points/${f#release/points-}"; done
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: manifest
          path: work/runs/${{ needs.start.outputs.name }}
      - name: Install the pinned Claude Code CLI (paid runs only)
        if: needs.start.outputs.paid == 'true'
        env:
          CLAUDE_CODE: ${{ needs.start.outputs.claude_code }}
        run: |
          npm install --global "@anthropic-ai/claude-code@${CLAUDE_CODE}"
          # the CLI must start, at exactly the pinned version, before any paid review
          found=$(claude --version | awk '{print $1}')
          if [ "$found" != "$CLAUDE_CODE" ]; then echo "claude CLI is '$found', expected $CLAUDE_CODE" >&2; exit 1; fi
      - name: Review every head (run.json from the start job is kept, never recomputed)
        # shorter than the job's 350 so the always() steps below still record and upload partial records
        timeout-minutes: 320
        env:
          ENTRANTS: ${{ inputs.entrants }}
          REPO: ${{ matrix.repo }}
          NAME: ${{ needs.start.outputs.name }}
          PAID: ${{ needs.start.outputs.paid }}
          REPOS: ${{ needs.start.outputs.repos }}
          MODEL: ${{ inputs.model }}
          MAX_USD: ${{ inputs.max_usd }}
          HEAD_BOUNDS: ${{ inputs.head_bounds }}
          PROVIDER: ${{ inputs.provider }}
          # the provider's key exists in this step only, and only for a paid run; the harness passes it to paid tools alone
          ANTHROPIC_API_KEY: ${{ needs.start.outputs.paid == 'true' && inputs.provider == 'anthropic' && secrets.ANTHROPIC_API_KEY || '' }}
          OPENROUTER_API_KEY: ${{ needs.start.outputs.paid == 'true' && inputs.provider == 'openrouter' && secrets.OPENROUTER_API_KEY || '' }}
          MAX_HEADS: ${{ inputs.max_heads }}
          SUBSAMPLE: ${{ inputs.subsample }}
          DIAGNOSTIC: ${{ inputs.diagnostic }}
          RIGOUR_VERSION: ${{ inputs.rigour_version }}
          RIGOUR_CONFIG: ${{ inputs.rigour_config }}
        run: |
          paid_args=(--max-heads "$MAX_HEADS")
          if [ -n "$SUBSAMPLE" ]; then paid_args+=(--subsample "$SUBSAMPLE"); fi
          if [ -n "$DIAGNOSTIC" ]; then paid_args+=(--diagnostic "$DIAGNOSTIC"); fi
          if [ -n "$RIGOUR_VERSION" ]; then paid_args+=(--rigour-version "$RIGOUR_VERSION"); fi
          if [ -n "$RIGOUR_CONFIG" ]; then paid_args+=(--rigour-config "$RIGOUR_CONFIG"); fi
          if [ "$PAID" = "true" ]; then
            # this job's share of the run's cap: in proportion to its selected heads, or even without a selection
            share=$(python3 - <<'PY'
          import json, os
          from pathlib import Path
          from bench.subsample import cap_shares, read_selection
          selection = read_selection(Path(os.environ["SUBSAMPLE"])) if os.environ["SUBSAMPLE"] else None
          print(cap_shares(selection, json.loads(os.environ["REPOS"]), float(os.environ["MAX_USD"]))[os.environ["REPO"]])
          PY
          )
            paid_args+=(--model "$MODEL" --max-usd "$share" --provider "$PROVIDER")
            for bound in $HEAD_BOUNDS; do paid_args+=(--head-bound "$bound"); done
          fi
          # word splitting of ENTRANTS is intended: one argument per entrant name
          python -m bench run --entrants $ENTRANTS --repo "$REPO" --out "work/runs/$NAME" "${paid_args[@]}"
      - name: Slug
        id: slug
        if: always()
        env:
          REPO: ${{ matrix.repo }}
        run: echo "slug=${REPO/\//__}" >> "$GITHUB_OUTPUT"
      - name: Hash the installed files that hold each paid entrant's instructions (never their text)
        if: always() && needs.start.outputs.paid == 'true'
        env:
          NAME: ${{ needs.start.outputs.name }}
          SLUG: ${{ steps.slug.outputs.slug }}
        run: |
          mkdir -p "work/runs/$NAME"
          python -m bench.harness.prompts installed "work/runs/$NAME/instructions-$SLUG.json"
      - name: Record this repo's job outcome
        if: always()
        env:
          NAME: ${{ needs.start.outputs.name }}
          SLUG: ${{ steps.slug.outputs.slug }}
          OUTCOME: ${{ job.status }}
        run: |
          mkdir -p "work/runs/$NAME/_status"
          echo "$OUTCOME" > "work/runs/$NAME/_status/$SLUG.txt"
      - name: Check the records (never gates the upload; a failure marks the draft instead)
        id: check
        if: always()
        env:
          NAME: ${{ needs.start.outputs.name }}
          SLUG: ${{ steps.slug.outputs.slug }}
        run: |
          mkdir -p "work/runs/$NAME/_status"
          if python -m bench.release_check "work/runs/$NAME" 2> check.log; then
            echo ok > "work/runs/$NAME/_status/$SLUG-check.txt"
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            { echo "check failed:"; tail -n 5 check.log; } > "work/runs/$NAME/_status/$SLUG-check.txt"
            echo "passed=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: runs-${{ steps.slug.outputs.slug }}
          path: |
            work/runs/${{ needs.start.outputs.name }}
            !work/runs/${{ needs.start.outputs.name }}/_scratch
          if-no-files-found: error
          # records that failed the check stay only long enough to inspect and fix (public repo artifacts)
          retention-days: ${{ steps.check.outputs.passed == 'true' && 90 || 3 }}

  score:
    needs: [start, review]
    # a failed repo's review job must not lose the others: score whatever was recorded
    if: always() && needs.start.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 340  # file versions come through the rate-limited API
    env:
      NAME: ${{ needs.start.outputs.name }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0  # label commit times are checked against the run's start
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Fetch the frozen corpus
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.corpus_tag }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.json' --dir release
          mkdir -p work/corpus work/points
          for f in release/corpus-*.json; do mv "$f" "work/corpus/${f#release/corpus-}"; done
          for f in release/points-*.json; do mv "$f" "work/points/${f#release/points-}"; done
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: runs-*
          merge-multiple: true
          path: work/runs/${{ needs.start.outputs.name }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: manifest
          path: work/runs/${{ needs.start.outputs.name }}
      - name: List repos whose review job did not succeed
        env:
          REPOS: ${{ needs.start.outputs.repos }}
        run: |
          mkdir -p "results/$NAME"
          : > "results/$NAME/missing-repos.txt"
          for repo in $(echo "$REPOS" | jq -r '.[]'); do
            status_file="work/runs/$NAME/_status/${repo/\//__}.txt"
            outcome=$(cat "$status_file" 2>/dev/null || echo "no records")
            if [ "$outcome" != "success" ]; then
              echo "$repo ($outcome)" >> "results/$NAME/missing-repos.txt"
            fi
          done
          cat "results/$NAME/missing-repos.txt"
      - name: Score, draw the calibration sample, report
        env:
          GH_TOKEN: ${{ github.token }}
          PROVIDER: ${{ inputs.provider }}
          MAX_HEADS: ${{ inputs.max_heads }}
          DIAGNOSTIC: ${{ inputs.diagnostic }}
          RIGOUR_VERSION: ${{ inputs.rigour_version }}
          RIGOUR_CONFIG: ${{ inputs.rigour_config }}
        run: |
          mkdir -p "results/$NAME"
          if [ "$MAX_HEADS" = "0" ] && [ -z "$DIAGNOSTIC" ]; then
            python -m bench score --run "work/runs/$NAME" --out "results/$NAME"
            python -m bench calibrate draw --run "work/runs/$NAME" --results "results/$NAME" --seed "$GITHUB_RUN_ID"
            python -m bench report --run "work/runs/$NAME" --results "results/$NAME"
          fi
          spend_args=()
          if [ "$PROVIDER" = "openrouter" ]; then spend_args=(--openrouter); fi
          python -m bench spend --run "work/runs/$NAME" "${spend_args[@]}" > "results/$NAME/spend.md"
      - name: Check results and records (a failure marks the draft "check failed"; nothing is dropped)
        run: |
          : > "results/$NAME/check-failed.txt"
          for status in work/runs/$NAME/_status/*-check.txt; do
            if [ -f "$status" ] && ! grep -qx ok "$status"; then cat "$status" >> "results/$NAME/check-failed.txt"; fi
          done
          if ! python -m bench.release_check "results/$NAME" "work/runs/$NAME" 2> check.log; then
            { echo "check failed (results):"; tail -n 5 check.log; } >> "results/$NAME/check-failed.txt"
          fi
          cat "results/$NAME/check-failed.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: results
          path: |
            results/${{ needs.start.outputs.name }}
            work/runs/${{ needs.start.outputs.name }}
          if-no-files-found: error
          retention-days: 90

  draft-release:
    needs: [start, score]
    if: always() && needs.score.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      NAME: ${{ needs.start.outputs.name }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: results
          path: out
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          CORPUS_TAG: ${{ inputs.corpus_tag }}
          ENTRANTS: ${{ inputs.entrants }}
          MAX_HEADS: ${{ inputs.max_heads }}
          DIAGNOSTIC: ${{ inputs.diagnostic }}
          RIGOUR_VERSION: ${{ inputs.rigour_version }}
          RIGOUR_CONFIG: ${{ inputs.rigour_config }}
        run: |
          tar -czf "runs-$NAME.tar.gz" -C "out/work/runs" "$NAME"
          {
            if [ -n "$DIAGNOSTIC" ]; then
              echo "**DIAGNOSTIC run, never scored: it is not a result.** Purpose: $DIAGNOSTIC"
              echo
              python3 -c 'import json, sys; print("Limit: " + json.load(open(sys.argv[1]))["diagnostic"]["limit"])' "out/work/runs/$NAME/run.json"
              echo
            fi
            if [ -s "out/results/$NAME/check-failed.txt" ]; then
              echo "**CHECK FAILED: do not publish.** The records are kept for inspection; a repo job whose records failed the check uploads them with a 3-day retention (90 when they pass):"
              echo
              sed 's/^/    /' "out/results/$NAME/check-failed.txt"
              echo
            fi
            if [ "$MAX_HEADS" != "0" ]; then
              echo "**SMOKE run, never scored:** at most $MAX_HEADS head(s) per entrant per repo (the first with at least 20 changed lines). It checks that the paid entrants work and what a head costs; it is not a result."
              echo
            fi
            echo "Run of: $ENTRANTS (draft; not published until checked with \`bench guard\`)."
            echo
            echo "- run record (start time, entrant versions, label commit and blob hashes):"
            echo
            echo '```json'
            cat "out/work/runs/$NAME/run.json"
            echo '```' 
            echo "- corpus: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/$CORPUS_TAG"
            if grep -q "estimated" "out/results/$NAME/spend.md" 2>/dev/null; then
              echo
              cat "out/results/$NAME/spend.md"
            fi
            if [ -s "out/results/$NAME/missing-repos.txt" ]; then
              echo "- repos whose review job did not succeed (missing heads are scored as unavailable): $(paste -sd, "out/results/$NAME/missing-repos.txt")"
            fi
            echo "- this run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- commit: ${GITHUB_SHA}"
          } > notes.md
          if [ -n "$DIAGNOSTIC" ]; then
            gh release create "diagnostic-$NAME" --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" \
              --title "diagnostic-$NAME" --notes-file notes.md "runs-$NAME.tar.gz" "out/results/$NAME/spend.md"
          elif [ "$MAX_HEADS" != "0" ]; then
            gh release create "smoke-$NAME" --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" \
              --title "smoke-$NAME" --notes-file notes.md "runs-$NAME.tar.gz" "out/results/$NAME/spend.md"
          else
            gh release create "run-$NAME" --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" \
              --title "run-$NAME" --notes-file notes.md \
              "runs-$NAME.tar.gz" "out/work/runs/$NAME/ledger.jsonl" \
              "out/results/$NAME/summary.md" "out/results/$NAME/calibration.yaml"
          fi
