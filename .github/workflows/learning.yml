name: learning

# The learning run's FREE steps (docs/LEARNING.md): no model, no paid key.
# For each pull request in the selection: crawl the review comments of the
# pull requests merged before it opened, build its lesson store with Rigour's
# own learner, check the store for leaks, and count the heads a learned review
# would serve at least one lesson. The crawl and the stores hold review text:
# they live in the Actions cache and the runner only, never in an artifact or a
# release (both are public on a public repo). The upload is the pre-check:
# numbers and lesson ids, checked for review text here and with `bench guard`
# by a maintainer before anything is published.

on:
  workflow_dispatch:
    inputs:
      corpus_tag:
        description: Published corpus release tag, e.g. corpus-2026-10-09-123456789
        required: true
      subsample:
        description: Selection file, e.g. subsamples/run-2.yaml
        required: true
      repos:
        description: Repos (space separated)
        default: "immich-app/immich tailscale/tailscale"
      rigour_core:
        description: "@rigour-labs/core version whose learner builds the stores (exact, or latest)"
        default: latest

permissions:
  contents: read

concurrency:
  group: learning
  cancel-in-progress: false

jobs:
  start:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      repos: ${{ steps.repos.outputs.repos }}
      core: ${{ steps.core.outputs.core }}
    steps:
      - id: repos
        env:
          REPOS: ${{ inputs.repos }}
        run: echo "repos=$(printf '%s\n' $REPOS | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"
      - id: core
        env:
          WANTED: ${{ inputs.rigour_core }}
        run: |
          core=$(npm view "@rigour-labs/core@${WANTED}" version | tail -1)
          if [ -z "$core" ]; then echo "no @rigour-labs/core version '$WANTED'" >&2; exit 1; fi
          echo "core=$core" >> "$GITHUB_OUTPUT"

  precheck:
    needs: start
    runs-on: ubuntu-latest
    timeout-minutes: 340  # GITHUB_TOKEN allows 1,000 API requests an hour; the client waits for resets
    strategy:
      fail-fast: false
      max-parallel: 1     # one hourly API quota for the whole repository
      matrix:
        repo: ${{ fromJSON(needs.start.outputs.repos) }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - run: pip install -e .
      - name: Install Rigour's learner at the exact version
        env:
          CORE: ${{ needs.start.outputs.core }}
        run: npm install --prefix "$RUNNER_TEMP/rigour" --no-save "@rigour-labs/core@${CORE}"
      - name: Fetch the frozen corpus
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.corpus_tag }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'corpus-*.json' --dir release
          mkdir -p work/corpus
          for f in release/corpus-*.json; do mv "$f" "work/corpus/${f#release/corpus-}"; done
      - id: slug
        env:
          REPO: ${{ matrix.repo }}
        run: echo "slug=${REPO//\//__}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: work/learn-cache
          key: learn-cache-${{ steps.slug.outputs.slug }}-${{ github.run_id }}
          restore-keys: learn-cache-${{ steps.slug.outputs.slug }}-
      - name: Crawl, cutoffs and diffs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ matrix.repo }}
          SUBSAMPLE: ${{ inputs.subsample }}
        run: python -m bench learning prepare --repo "$REPO" --subsample "$SUBSAMPLE" --out work/learning
      - name: Build each pull request's store with Rigour's learner
        env:
          REPO: ${{ matrix.repo }}
          SLUG: ${{ steps.slug.outputs.slug }}
        run: |
          node bench/learning/stores.mjs "$RUNNER_TEMP/rigour/node_modules/@rigour-labs/core" \
            work/learning/crawl.json "work/repos/$SLUG" work/learning/heads.json work/learning
      - name: Leak assertions and the pre-check
        run: python -m bench learning check --out work/learning
      - name: Check the upload holds no review text
        env:
          SLUG: ${{ steps.slug.outputs.slug }}
          REPO: ${{ matrix.repo }}
          CORE: ${{ needs.start.outputs.core }}
        run: |
          mkdir -p upload
          cp "work/learning/precheck-${SLUG}.json" upload/
          python -m bench.release_check upload
          {
            echo "### $REPO (core $CORE)"
            echo '```'
            jq '.totals' "upload/precheck-${SLUG}.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: precheck-${{ steps.slug.outputs.slug }}
          path: upload/*.json
          if-no-files-found: error
          retention-days: 90
      - name: Fail when any store leaks (after the upload, so the record is kept)
        env:
          SLUG: ${{ steps.slug.outputs.slug }}
        run: test "$(jq '.totals.leaking_prs' "upload/precheck-${SLUG}.json")" = 0
