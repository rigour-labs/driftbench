name: build-retest

# Re-run a finished build run's hidden tests on its recorded diffs (free; no
# agent, no model, no key): each task's parent, the agent's diff applied, the
# pull request's tests written in, `go test`, with the first error lines kept.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: The build run whose records to retest (its Actions run id)
        required: true
      tasks:
        description: Its task file, e.g. tasks/build-pilot.yaml
        required: true

permissions:
  contents: read
  actions: read

jobs:
  retest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: stable
          cache: false
      - run: pip install -e .
      - name: Fetch the run's records
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" --dir work/records
          echo "RUN_DIR=$(dirname "$(find work/records -name run.json | head -1)")" >> "$GITHUB_ENV"
      - name: Retest
        env:
          TASKS: ${{ inputs.tasks }}
        run: python -m bench build retest --run "$RUN_DIR" --tasks "$TASKS"
      - name: Check the upload holds no review text
        run: |
          mkdir -p upload && cp "$RUN_DIR/retest.json" upload/
          python -m bench.release_check upload
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: retest-${{ inputs.run_id }}
          path: upload/retest.json
          if-no-files-found: error
          retention-days: 90
