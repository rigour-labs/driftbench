# Repositories in the benchmark.
#
# `pin` is the default-branch commit the corpus was cut at: only pull requests
# merged at or before `pinned_at` are eligible, so a re-run selects the same
# pull requests. Every pull request's own base and head SHAs are recorded in
# the frozen corpus, not here.
#
# We redistribute none of these projects' code. The corpus stores pull request
# numbers, commit SHAs, review comment IDs and character spans; tools run on a
# local clone during a run and the clone is discarded.
#
# `enabled: false` repos are listed for the next phase and are skipped by runs.

repos:
  - name: tailscale/tailscale
    licence: BSD-3-Clause
    default_branch: main
    pin: a89b32904fe50bc55a1121092c0247db843368fe
    pinned_at: "2026-10-08T15:35:14Z"
    enabled: true

  - name: zulip/zulip
    licence: Apache-2.0
    default_branch: main
    pin: 29fbc01fa8232da1176932865d31d34085b8f39e
    pinned_at: "2026-10-08T14:10:33Z"
    enabled: true

  - name: immich-app/immich
